<title>사업 및 시설물 관리 | 민자철도 운영관리시스템</title>
<style>
:root{--brand:#1f3f99;--tx:#1b2330;--tx2:#4a5568;--line:#c5ccd8;--bad:#b42318;--bg:#f5f7fa}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Malgun Gothic",sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;display:grid;place-items:center;padding:16px}
main{width:100%;max-width:380px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:32px 28px}
h1{font-size:20px;margin-bottom:6px}
p{font-size:14px;color:var(--tx2);line-height:1.6}
label{display:block;font-weight:700;font-size:15px;margin:22px 0 6px}
input{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;font-size:16px}
button{width:100%;height:46px;margin-top:12px;border:0;border-radius:10px;background:var(--brand);color:#fff;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:3px solid #f2a900;outline-offset:2px}
#msg{margin-top:10px;font-size:14px;font-weight:700;color:var(--bad);min-height:20px}
#gate{display:none}
</style>
</head>

<main id="gate">
