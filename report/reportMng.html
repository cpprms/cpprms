<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>레포트 관리</title>
<style>
:root{--brand:#1f3f99;--tx:#1b2330;--tx2:#4a5568;--line:#c5ccd8;--bad:#b42318;--bg:#f5f7fa}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Malgun Gothic",sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;display:grid;place-items:center;padding:16px}
main{width:100%;max-width:380px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:32px 28px}
h1{font-size:20px;margin-bottom:6px}
p{font-size:14px;color:var(--tx2);line-height:1.6}
label{display:block;font-weight:700;font-size:15px;margin:22px 0 6px}
input{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;font-size:16px}
button{width:100%;height:46px;margin-top:12px;border:0;border-radius:10px;background:var(--brand);color:#fff;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:3px solid #f2a900;outline-offset:2px}
#msg{margin-top:10px;font-size:14px;font-weight:700;color:var(--bad);min-height:20px}
#gate{display:none}
</style>
</head>
<body>
<main id="gate">
  <h1>민자철도 화면 개선안</h1>
  <p>내부 검토용 시연본입니다. 비밀번호를 입력하세요. 같은 창에서는 한 번만 입력하면 됩니다.</p>
  <form id="f"><label for="pw">비밀번호</label><input id="pw" type="password" autocomplete="current-password" required><button id="go">열기</button><div id="msg" role="alert"></div></form>
</main>

  function show(buf){var h=new TextDecoder().decode(buf);var go=function(){document.open();document.write(h);document.close();};
    if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",function(){setTimeout(go,0);});else setTimeout(go,0);}
  function dec(raw){return crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]).then(function(k){return crypto.subtle.decrypt({name:"AES-GCM",iv:u(I)},k,u(C));});}
  var saved=null;try{saved=sessionStorage.getItem(K);}catch(e){}
  if(saved){dec(u(saved)).then(show,function(){try{sessionStorage.removeItem(K);}catch(e){}gate();});}else gate();
  function gate(){
    document.getElementById("gate").style.display="block";
    var f=document.getElementById("f"),b=document.getElementById("go"),m=document.getElementById("msg"),p=document.getElementById("pw");p.focus();
    f.onsubmit=function(e){e.preventDefault();b.disabled=true;m.textContent="확인 중...";
      crypto.subtle.importKey("raw",new TextEncoder().encode(p.value),"PBKDF2",false,["deriveBits"])
      .then(function(k){return crypto.subtle.deriveBits({name:"PBKDF2",salt:u(S),iterations:N,hash:"SHA-256"},k,256);})
      .then(function(bits){return dec(bits).then(function(buf){try{sessionStorage.setItem(K,btoa(String.fromCharCode.apply(null,new Uint8Array(bits))));}catch(e){}show(buf);});})
      .catch(function(){b.disabled=false;m.textContent="비밀번호가 맞지 않습니다.";p.select();});};
  }
})();
</script>
